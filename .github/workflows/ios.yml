name: Comic Lens iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-simulator:
    name: Build unsigned iOS Simulator app
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show selected Xcode and SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Test page identity regression
        shell: bash
        run: |
          set -euo pipefail
          swiftc ComicLens/PageIdentity.swift ComicLens/OCRGrouping.swift Tests/PageIdentityTests.swift -o "$RUNNER_TEMP/page-identity-tests"
          "$RUNNER_TEMP/page-identity-tests"
      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build for iOS Simulator
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project ComicLens.xcodeproj \
            -scheme ComicLens \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/ComicLensDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/comic-lens-build.log"

      - name: Package simulator app
        run: |
          APP="$RUNNER_TEMP/ComicLensDerivedData/Build/Products/Debug-iphonesimulator/ComicLens.app"
          test -d "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$GITHUB_WORKSPACE/ComicLens-iOS-Simulator.zip"

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: ComicLens-iOS-Simulator
          path: ComicLens-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ComicLens-build-log
          path: ${{ runner.temp }}/comic-lens-build.log
          if-no-files-found: ignore
          retention-days: 7