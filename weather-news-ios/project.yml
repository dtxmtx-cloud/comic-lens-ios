name: SkyNews
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  SkyNews:
    type: application
    platform: iOS
    sources:
      - path: SkyNews
    info:
      path: SkyNews/Info.plist
      properties:
        CFBundleDisplayName: "空模様ニュース"
        NSLocationWhenInUseUsageDescription: "現在地の天気、気温、空気質を表示するため位置情報を使用します。"
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.dtxmtx.skynewsflow
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: "NO"